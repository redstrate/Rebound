name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    # Skip running on PR events that come from the same repository, it will just duplicate the branch action
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    steps:
      - uses: actions/checkout@v4
      - name: Build Plugin
        uses: redstrate/build-dalamud-plugin@main
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
            name: Latest
            path: |
                /home/runner/work/Rebound/Rebound/Rebound/bin/x64/Release/
                !/home/runner/work/Rebound/Rebound/Rebound/bin/x64/Release/Rebound/
